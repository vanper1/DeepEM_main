[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepem-main"
version = "0.2.0"
description = "DeepEM real integration main platform with collector upload and signal analysis pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "python-dotenv>=1.0,<2",
  "matplotlib>=3.8,<4",
  "python-multipart>=0.0.9,<1",
  "elasticsearch>=8.15,<9",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pypdf>=5.0,<6",
  "python-docx>=1.1,<2",
  "websockets>=12,<16",
  "xlrd>=2.0,<3",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deepem*", "main*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
main = [
  "web/**/*",
  "data/**/*",
  "knowledge/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
