<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepEM 智能电磁检测平台</title>
  <link rel="stylesheet" href="/static/styles.css?v=merged-20260604">
</head>
<body class="deem-body">
  <main class="deem-login">
    <section class="deem-login-card">
      <div class="deem-login-title">
        <h1>DeepEM 智能电磁检测平台</h1>
        <div class="org">中国科学院信息工程研究所</div>
      </div>
      <img class="deem-login-logo" src="/static/assets/deepem-logo.png" alt="DeepEM">
      <form id="loginForm" class="deem-login-form" onsubmit="return false;">
        <label class="deem-field inline"><span>用户名：</span><input class="deem-input" value="" autocomplete="username"></label>
        <label class="deem-field inline"><span>密码：</span><input class="deem-input" type="password" autocomplete="current-password"></label>
        <button id="loginButton" class="deem-login-submit" type="button">登录</button>
      </form>
    </section>
  </main>
  <div class="deem-footer-org">中国科学院信息工程研究所</div>
  <script src="/static/js/portal.js?v=merged-20260604"></script>
