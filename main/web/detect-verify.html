<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepEM 智能检测</title>
  <link rel="stylesheet" href="/static/styles.css?v=merged-20260604">
</head>
<body class="deem-body">
<div class="deem-app">

  <header class="deem-header">
    <div class="deem-brandline"><span class="deem-mini-logo">EM</span><span class="deem-brand-title">DeepEM 智能电磁检测平台</span></div>
    <div class="deem-page-title"><h1>DeepEM 智能检测</h1><div class="org">中国科学院信息工程研究所</div></div>
    <div class="deem-header-actions"><a class="deem-btn ghost" href="/detect">返回主页面</a></div>
  </header>
  <main class="deem-main">

<section class="deem-check-layout">
  <section class="deem-panel strong">
    <div class="deem-panel-title"><h2 id="verifyTaskName">新建任务校验</h2><span class="hint">大模型理解任务，编排流程的过程输出</span></div>
    <div class="deem-process-log">
      <div class="deem-step"><span class="dot"></span><p>解析任务目标：确认检测地点、频段范围、异常识别指标。</p></div>
      <div class="deem-step"><span class="dot"></span><p>编排检测流程：模板加载 → 设备校验 → 参数下发 → 采集切片 → 智能研判。</p></div>
      <div class="deem-step"><span class="dot"></span><p>校验知识资源：场所基线、历史指纹、算法组件均已准备。</p></div>
      <div class="deem-step"><span class="dot"></span><p id="verifyResourceText">任务执行所需资源已通过校验。</p></div>
    </div>
  </section>
  <section class="deem-panel deem-resource-card">
    <div class="deem-checkmark">✓</div>
    <h2>校验通过</h2>
    <p>任务校验通过后，可点击开始执行进入已有研判页面。</p>
    <div class="deem-form-actions"><a class="deem-btn ghost" href="/detect/new">返回</a><button id="startDetectBtn" class="deem-btn primary" type="button">开始执行</button></div>
  </section>
</section>
  </main>
  <div class="deem-footer-org">中国科学院信息工程研究所</div>
</div>
<script src="/static/js/portal.js?v=merged-20260604"></script>
</body>
</html>
