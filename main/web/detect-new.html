<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepEM 智能检测</title>
  <link rel="stylesheet" href="/static/styles.css?v=merged-20260604">
</head>
<body class="deem-body">
<div class="deem-app">

  <header class="deem-header">
    <div class="deem-brandline"><span class="deem-mini-logo">EM</span><span class="deem-brand-title">DeepEM 智能电磁检测平台</span></div>
    <div class="deem-page-title"><h1>DeepEM 智能检测</h1><div class="org">中国科学院信息工程研究所</div></div>
    <div class="deem-header-actions"><a class="deem-btn ghost" href="/detect">返回</a></div>
  </header>
  <main class="deem-main">

<section class="deem-form-grid">
  <section class="deem-panel strong">
    <div class="deem-panel-title"><h2>新建任务信息</h2><a class="deem-btn ghost" href="/detect">返回</a></div>
    <div class="deem-form-section">
      <label class="deem-field"><span>任务名称：</span><input id="taskName" class="deem-input" value="园区电磁环境智能检测"></label>
      <label class="deem-field"><span>任务地点：</span><input class="deem-input" value="中国科学院信息工程研究所园区"></label>
      <label class="deem-field"><span>操作员：</span><input class="deem-input" value="operator"></label>
      <div class="deem-mode-group">
        <label class="deem-mode-card"><input type="radio" name="taskMode" value="template" checked><span><strong>模板检测模式</strong><span>从右侧检测模板列表选择一个检测模板</span></span></label>
        <label class="deem-mode-card"><input type="radio" name="taskMode" value="command"><span><strong>任务指令模式</strong><span>输入任务指令，大模型自动编排流程</span></span></label>
      </div>
      <div id="commandPane" style="display:none"><label class="deem-field"><span>任务指令：</span><textarea class="deem-textarea" placeholder="例如：对北楼四层机房进行 2.4GHz/5GHz 频谱巡检，并识别异常 Wi-Fi 和蓝牙信号。"></textarea></label></div>
      <div class="deem-form-actions"><button id="createTaskBtn" class="deem-btn primary" type="button">新建任务</button></div>
    </div>
  </section>
  <section class="deem-panel">
    <div class="deem-panel-title"><h2>检测模板列表</h2><span class="hint">选中后信息展示在左侧</span></div>
    <div id="templatePane" class="deem-list-card"></div>
  </section>
</section>
  </main>
  <div class="deem-footer-org">中国科学院信息工程研究所</div>
</div>
<script src="/static/js/portal.js?v=merged-20260604"></script>
</body>
</html>
